name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    # Agent.Windows and the Windows client preview target net10.0-windows.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Release build and contract suites
        shell: pwsh
        run: ./scripts/Validate-Baseline.ps1
