*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);overflow:hidden}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}.app{height:100dvh;min-height:560px;display:grid;grid-template-columns:62px minmax(0,1fr);grid-template-rows:54px minmax(0,1fr) 26px}

.count-7,.workspace.count-8{grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}.workspace.maxed{grid-template-columns:1fr;grid-template-rows:1fr}.workspace.maxed .chart-card:not(.maximized){display:none}.chart-card{background:var(--card);border:1px solid var(--line);border-radius:7px;display:flex;flex-direction:column;overflow:hidden;position:relative;min-height:0;min-width:0;transition:border-color .15s}.chart-card:hover{border-color:color-mix(in srgb,var(--cyan) 60%,var(--line))}.chart-card.maximized{border-color:var(--cyan)}.chart-header{height:39px;display:flex;gap:8px;align-items:center;padding:0 11px;flex:none;border-bottom:1px solid var(--line);min-width:0;cursor:zoom-in}.chart-card.maximized .chart-header{cursor:zoom-out}.signal-marker{width:3px;height:15px;border-radius:3px;background:var(--signal-color,var(--cyan));flex:none}.chart-name{font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.reading{font-size:12px;font-weight:850;color:var(--signal-color,var(--cyan));font-variant-numeric:tabular-nums}.units{font-size:11px;color:var(--muted)}.chart-meta{color:var(--muted);font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chart-tools{margin-left:auto;display:flex;gap:5px;align-items:center}.mini{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:5px;width:26px;height:25px;display:grid;place-items:center;font-size:15px}.mini:hover{background:var(--hover);color:var(--text)}.mini.remove:hover{color:var(--red)}.chart-plot{flex:1;min-height:0;min-width:0;position:relative;cursor:crosshair}.chart-plot canvas{height:100%;width:100%;display:block}.chart-footer{height:24px;border-top:1px solid var(--line);color:var(--muted);display:flex;gap:12px;align-items:center;padding:0 11px;font-size:10px;flex:none}.chart-footer b{color:var(--text);font-weight:650}.chart-tooltip{position:absolute;pointer-events:none;display:none;z-index:4;white-space:nowrap;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 10px;box-shadow:0 7px 25px #0005;font-size:11px}.compare-check{appearance:none;margin:0;width:16px;height:16px;border:1px solid var(--cyan);border-radius:3px;cursor:pointer}.compare-check:checked{background:var(--cyan);box-shadow:inset 0 0 0 3px var(--card)}.statusbar{grid-column:2;grid-row:3;display:flex;gap:16px;align-items:center;padding:0 13px;background:var(--sidebar);border-top:1px solid var(--line);font-size:10px;color:var(--muted)}.statusbar .grow{flex:1}.statusbar b{color:var(--cyan);font-weight:600}

/* HF2: the Core shell owns navigation, logo, theme and language. */
.app{display:flex!important;flex-direction:column;min-height:0!important;height:100dvh!important}
.main{grid-column:auto!important;display:flex;min-height:0!important;height:100%;flex:1}
.toolbar{height:48px;min-height:48px}
.workspace{flex:1}
.chart-select{display:none;position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--cyan) 18%,transparent);border-left:1px solid var(--cyan);border-right:1px solid var(--cyan);pointer-events:none;z-index:3}

.chart-plot.zoom-dragging,.chart-plot.zoom-dragging canvas{cursor:col-resize}

html[data-theme="light"]{--bg:#f4f8fc;--sidebar:#fff;--panel:#fff;--card:#fff;--line:#9cb3c6;--text:#142d43;--muted:#435d73;--cyan:#006e95;--cyan-dim:#d9f0fa;--green:#087c61;--red:#bd2e4e;--amber:#915a07;--hover:#e5f2f8;--grid:#c7d7e5;--raised:#ebf4fa}

<div class="app">
